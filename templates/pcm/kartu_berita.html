<div class="card berita-card h-100 shadow-sm">
  {% if berita.gambar_sampul %}
    <img src="{{ berita.gambar_sampul.url }}" class="card-img-top" alt="{{ berita.judul }}" style="height: 200px; object-fit: cover;">
  {% endif %}
  <div class="card-body d-flex flex-column">
    <div class="small text-muted mb-1">{{ berita.tanggal_terbit|date:"d M Y" }}</div>
    <h5 class="card-title">
      <a href="{% url 'pcm:detail_berita' berita.slug %}" class="text-decoration-none text-dark">{{ berita.judul }}</a>
    </h5>
    <p class="card-text text-muted flex-grow-1">{{ berita.ringkasan }}</p>
    <a href="{% url 'pcm:detail_berita' berita.slug %}" class="btn btn-sm btn-outline-success mt-auto">Baca Selengkapnya</a>
  </div>
</div>
